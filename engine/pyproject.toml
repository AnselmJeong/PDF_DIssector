[project]
name = "pdfx"
version = "0.1.0"
description = "PDF Dissector engine: sidecar around literature-guide-read scripts"
requires-python = ">=3.10"
dependencies = [
  "pdfplumber>=0.10",
  "fonttools>=4",
  "pillow",
  "beautifulsoup4",
  "lxml",
]

[dependency-groups]
dev = ["pytest>=8", "reportlab"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pdfx"]

[tool.pytest.ini_options]
testpaths = ["tests", "pdfx/vendor/lgr/tests"]
